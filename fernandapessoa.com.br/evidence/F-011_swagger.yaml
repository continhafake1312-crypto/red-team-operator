components:
  schemas:
    OrganizationFeeConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        payment_method:
          type: string
          nullable: true
          description: 'Payment method filter: credit_card, pix, boleto. Null = wildcard
            (applies to all methods).'
          example: credit_card
        installment_count:
          type: integer
          nullable: true
          description: Installment count filter. Null = applies to any installment
            count.
          example: 12
        percentage_bps:
          type: integer
          description: LMS fee in basis points (100 bps = 1%). Applied to the order
            total.
          example: 500
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationFeeConfigInput:
      type: object
      properties:
        payment_method:
          type: string
          nullable: true
          example: credit_card
        installment_count:
          type: integer
          nullable: true
          example: 12
        percentage_bps:
          type: integer
          minimum: 0
          example: 500
        is_active:
          type: boolean
          default: true
      required:
      - percentage_bps
    OrganizationRefundPolicy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        payment_method:
          type: string
          nullable: true
          description: Null = applies to all payment methods.
          example: credit_card
        fixed_fee_refundable:
          type: boolean
          description: Whether the fixed processing fee is returned to the customer
            on refund.
        variable_fee_refundable:
          type: boolean
          description: Whether the variable LMS percentage fee is returned to the
            customer on refund.
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    OrganizationRefundPolicyInput:
      type: object
      properties:
        payment_method:
          type: string
          nullable: true
        fixed_fee_refundable:
          type: boolean
        variable_fee_refundable:
          type: boolean
        is_active:
          type: boolean
          default: true
    SchoolFeeConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        school_id:
          type: string
          format: uuid
        payment_method:
          type: string
          nullable: true
          description: Null = wildcard.
          example: credit_card
        installment_count:
          type: integer
          nullable: true
          description: Null = any installment count.
        percentage_bps:
          type: integer
          description: School-level LMS fee override. Must be >= organization base
            (OrganizationFeeConfig).
          example: 700
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SchoolFeeConfigInput:
      type: object
      properties:
        payment_method:
          type: string
          nullable: true
        installment_count:
          type: integer
          nullable: true
        percentage_bps:
          type: integer
          minimum: 0
          example: 700
        is_active:
          type: boolean
          default: true
      required:
      - percentage_bps
    PaymentPlanRevenueShare:
      type: object
      properties:
        id:
          type: string
          format: uuid
        payment_plan_id:
          type: string
          format: uuid
        role:
          type: string
          description: 'Participant role: lms, affiliate, co_producer, producer'
          enum:
          - lms
          - affiliate
          - co_producer
          - producer
        recipient_external_id:
          type: string
          description: Gateway recipient ID (e.g. Pagar.me re_xxxx)
          example: re_abc123
        share_type:
          type: string
          enum:
          - percentage
          - flat
          description: "'percentage' uses share_value as basis points; 'flat' as amount_cents"
        share_value:
          type: integer
          description: Basis points (if percentage) or amount in cents (if flat).
            Producer should be 0 (receives remainder).
          example: 1000
        payment_method:
          type: string
          nullable: true
          description: Null = applies to all payment methods.
        installment_count:
          type: integer
          nullable: true
          description: Null = applies to any installment count.
        priority:
          type: integer
          description: Processing order. Lower = higher priority. Producer typically
            100 (last, receives remainder).
          example: 2
        charge_processing_fee:
          type: boolean
        charge_remainder_fee:
          type: boolean
        liable:
          type: boolean
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentPlanRevenueShareInput:
