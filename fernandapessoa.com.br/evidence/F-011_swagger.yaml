info:
  title: API Youbiz
  version: v1
securityDefinitions:
  Bearer:
    description: 'JWT Authorization header using the Bearer scheme. Example: "Authorization:
      Bearer {token}"'
    type: apiKey
    name: Authorization
    in: header
security:
- Bearer: []
paths:
  "/signup":
    post:
      summary: Sign up a user
      tags:
      - Registration
      parameters: []
      responses:
        '200':
          description: user signed up
        '422':
          description: invalid request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                    password_confirmation:
                      type: string
                  required:
                  - email
                  - password
                  - password_confirmation
              required:
              - user
  "/login":
    post:
      summary: Log in a user
      tags:
      - Authentication
      parameters: []
      responses:
        '200':
          description: user logged in
        '401':
          description: unauthorized
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  type: object
                  properties:
                    email:
                      type: string
                    password:
                      type: string
                  required:
                  - email
                  - password
              required:
              - user
  "/logout":
    delete:
      summary: Log out a user
      tags:
      - Authentication
      security:
      - Bearer: []
      responses:
        '204':
          description: user logged out
