    <style>
    :root {
        color-scheme: dark;
        --accent: #B7090B;
        --accent-rgb: 183, 9, 11;
        --bg-controls: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 50%, transparent 100%);
        --text: #fff;
    }

    * { box-sizing: border-box; }

    html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: var(--text);
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
        overflow: hidden;
    }

    .player-container {
        position: relative;
        width: 100%;
        height: 100%;
        background: #000;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    #channel-player {
        width: 100%;
        height: 100%;
        object-fit: contain;
        cursor: pointer;
    }

    .youtube-iframe-wrap {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 2;
    }

    .youtube-iframe-wrap.hidden { display: none !important; }

    .youtube-iframe-wrap iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
    }

    .player-container.is-youtube-source #channel-player,
    .player-container.is-youtube-source .center-play-btn,
    .player-container.is-youtube-source .buffering-spinner {
        display: none !important;
    }

    /* Container dos controles */

    .center-play-btn {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: clamp(62px, 12vw, 92px);
        height: clamp(62px, 12vw, 92px);
        border: 2px solid rgba(var(--accent-rgb), .92);
        border-radius: 999px;
        background: rgba(0, 0, 0, .62);
        color: #fff;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        z-index: 12;
        cursor: pointer;
        box-shadow: 0 14px 38px rgba(0,0,0,.56), 0 0 30px rgba(var(--accent-rgb), .24);
        transition: opacity .2s ease, transform .2s ease, background .2s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .center-play-btn svg {
        width: 52%;
        height: 52%;
        fill: currentColor;
        margin-left: 5%;
    }

    .center-play-btn.is-hidden {
        opacity: 0;
        pointer-events: none;
        transform: translate(-50%, -50%) scale(.94);
    }

    .center-play-btn:hover {
        background: rgba(0, 0, 0, .78);
    }

    .controls-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        opacity: 1;
        transition: opacity 0.4s ease-in-out;
        pointer-events: none;
        z-index: 10;
    }

    .controls-overlay.hidden {
        opacity: 0;
    }

    /* Top Bar */
    .top-bar {
        padding: 24px 32px;
        background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
        pointer-events: auto;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
    }

    .channel-heading {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        max-width: min(680px, calc(100vw - 220px));
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    .channel-heading-logo {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        object-fit: contain;
        background: rgba(255,255,255,0.10);
        padding: 2px;
        flex-shrink: 0;
    }

    .channel-heading-title {
        margin: 0;
        color: #fff;
        font-size: 18px;
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: 0.2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
    }

    .channel-heading-live {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 2px 8px;
        border-radius: 6px;
        border: none;
        background: rgba(220, 38, 38, 0.92);
        color: #fff;
        flex-shrink: 0;
        cursor: pointer;
        box-shadow: 0 6px 18px rgba(220, 38, 38, 0.18);
        transition: background 0.18s ease, transform 0.18s ease;
    }

    .channel-heading-live:hover,
    .channel-heading-live:focus-visible {
        background: rgba(239, 68, 68, 0.96);
        transform: translateY(-1px);
        outline: none;
    }

    .channel-heading-live svg {
        width: 12px;
        height: 12px;
        color: #fff;
        overflow: visible;
    }

    .channel-live-wave-inner {
        animation: live-wave-inner 1.25s ease-in-out infinite;
        transform-origin: 12px 12px;
    }

    .channel-live-wave-outer {
        animation: live-wave-outer 1.25s ease-in-out infinite;
        transform-origin: 12px 12px;
    }

    .channel-live-core {
        animation: live-core-pulse 1.25s ease-in-out infinite;
        transform-origin: 12px 12px;
    }

    @keyframes live-wave-inner {
        0%, 100% { opacity: 0.42; transform: scale(0.94); }
        45% { opacity: 1; transform: scale(1.04); }
    }

    @keyframes live-wave-outer {
        0%, 100% { opacity: 0.24; transform: scale(0.9); }
        60% { opacity: 0.92; transform: scale(1.08); }
    }

    @keyframes live-core-pulse {
        0%, 100% { opacity: 1; transform: scale(0.88); }
        50% { opacity: 0.72; transform: scale(1.18); }
    }

    .channel-heading-live span {
        font-size: 10px;
        line-height: 1;
        font-weight: 700;
        text-transform: uppercase;
    }

    /* Botão Refresh (Travou?) */
    .refresh {
        display: flex;
        align-items: center;
        gap: 8px;
        background: #000000d1;
        border: none;
        color: #fff;
        padding: 5px 7px;
        border-radius: 10px;
        text-decoration: none;
        font-size: 14px;
        font-weight: 700;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
        transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
        pointer-events: auto;
        box-shadow: none;
    }

    .refresh:hover {
        background: #1f2430bf;
        color: #fff;
        transform: translateY(-1px);
    }

    .refresh svg {
        width: 16px;
        height: 16px;
        color: #ef4444 !important;
        stroke: #ef4444 !important;
        stroke-width: 2.5;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .refresh b {
        color: #ef4444 !important;
        font-weight: 800;
        letter-spacing: 0.35px;
        text-decoration: underline;
        text-decoration-thickness: 1px;
        text-underline-offset: 3px;
    }

    .refresh:hover svg,
    .refresh:hover b {
        color: #f87171 !important;
        stroke: #f87171 !important;
    }

    /* Bottom Bar */
    .bottom-bar {
        padding: 40px 32px 24px 32px;
        background: var(--bg-controls);
        pointer-events: auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .controls-left, .controls-right {
        display: flex;
        align-items: center;
        gap: 24px;
    }

    /* Botões SVG Premium */
    .control-btn {
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, color 0.2s;
        opacity: 0.85;
    }

    .control-btn:hover {
        opacity: 1;
        transform: scale(1.1);
        color: var(--accent);
    }

    .control-btn svg {
        width: 28px;
        height: 28px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    #play-pause-btn svg {
        width: 32px;
        height: 32px;
        fill: currentColor;
        stroke: none;
    }

    .control-btn.small svg { width: 24px; height: 24px; }

    /* Slider de Volume */
    .volume-container {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .volume-slider {
        width: 0;
        opacity: 0;
        -webkit-appearance: none;
        background: transparent;
        transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s;
        cursor: pointer;
    }

    .volume-container:hover .volume-slider,
    .volume-slider:focus {
        width: 90px;
        opacity: 1;
    }

    .volume-slider::-webkit-slider-runnable-track {
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
    }

    .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: var(--accent);
        margin-top: -5px;
        box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }

    /* Selectors e menus premium */
    .control-pill {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-height: 24px;
        padding: 0;
        background: none;
        border: none;
        box-shadow: none;
        transition: transform 0.2s, color 0.2s, opacity 0.2s;
        position: relative;
        opacity: 0.85;
        color: #fff;
    }

    .control-pill:hover,
    .control-pill:focus-within,
    .control-pill.is-open {
        opacity: 1;
        color: var(--accent);
        transform: scale(1.05);
    }

    .control-pill[hidden] {
        display: none !important;
    }

    .control-pill-icon {
        width: 24px;
        height: 24px;
        color: currentColor;
        flex: 0 0 auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .control-pill-icon svg,
    .menu-icon-btn svg {
        width: 24px;
        height: 24px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
    }

    .menu-control {
        position: relative;
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
    }

    .menu-control[hidden] {
        display: none !important;
    }

    .menu-icon-btn {
        background: none;
        border: none;
        color: #fff;
        cursor: pointer;
        padding: 0;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: transform 0.2s, color 0.2s, opacity 0.2s;
        opacity: 0.85;
    }

    .menu-icon-btn:hover,
    .menu-icon-btn:focus-visible,
    .menu-control.is-open .menu-icon-btn {
        outline: none;
        opacity: 1;
        transform: scale(1.1);
        color: var(--accent);
    }

    .menu-panel {
        position: absolute;
        right: -8px;
        bottom: calc(100% + 14px);
        min-width: 220px;
        max-width: min(300px, 82vw);
        padding: 8px;
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.14);
        background: rgba(10, 10, 14, 0.94);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        box-shadow: 0 18px 44px rgba(0,0,0,0.42);
        opacity: 0;
        transform: translateY(6px) scale(0.98);
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
    }

    .menu-control.is-open .menu-panel {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }

    .menu-section-label {
        padding: 8px 10px 6px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.46);
    }

    .menu-items {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .menu-item {
        width: 100%;
        min-height: 40px;
        border: none;
        border-radius: 12px;
        background: transparent;
        color: rgba(255,255,255,0.9);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        cursor: pointer;
        text-align: left;
        transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .menu-item:hover,
    .menu-item:focus-visible {
        outline: none;
        background: rgba(255,255,255,0.08);
        color: #fff;
        transform: translateX(-1px);
    }

    .menu-item.is-selected {
        background: rgba(229, 9, 20, 0.12);
        color: #fff;
    }

    .menu-item-main {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
        flex: 1 1 auto;
    }

    .menu-item-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
        line-height: 1.1;
    }

    .menu-item-label {
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .menu-item-meta {
        margin-top: 3px;
        font-size: 11px;
        color: rgba(255,255,255,0.5);
    }

    .menu-item-check {
        width: 18px;
        height: 18px;
        color: var(--accent);
        opacity: 0;
        flex: 0 0 auto;
        transition: opacity 0.18s ease;
    }

    .menu-item.is-selected .menu-item-check { opacity: 1; }

    .menu-item-check svg {
        width: 18px;
        height: 18px;
        stroke: currentColor;
        stroke-width: 2.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
    }

    .quality-icon-text {
        fill: currentColor;
        stroke: none;
        font-weight: 800;
        font-size: 6px;
        letter-spacing: 0.4px;
    }

    .source-select-wrap {
        position: relative;
        overflow: hidden;
        gap: 8px;
        min-height: 34px;
        padding: 6px 10px 6px 8px;
        border: none;
        border-radius: 10px;
        background: #15171d61;
        color: rgba(255,255,255,0.92);
        box-shadow: none;
        opacity: 1;
        transform: none;
        transition: background 0.18s ease, color 0.18s ease, transform 0.18s ease;
    }

    .source-select-wrap .control-pill-icon {
        width: 22px;
        height: 22px;
        border-radius: 7px;
        background: rgba(255,255,255,0.08);
        color: rgba(255,255,255,0.78);
    }

    .source-select-wrap .control-pill-icon svg {
        width: 16px;
        height: 16px;
        filter: none;
        stroke-width: 2.2;
    }

    .source-select-wrap:hover,
    .source-select-wrap:focus-within {
        background: #1b1e257a;
        color: #fff;
        transform: translateY(-1px);
    }

    .source-select-wrap:focus-within .control-pill-icon {

    .source-select option:checked {
        background: #242832;
        color: #fff;
    }

    /* Marca D'água - Movida para a parte inferior direita */
    .watermark {
        position: absolute;
        right: max(32px, env(safe-area-inset-right));
        bottom: calc(max(24px, env(safe-area-inset-bottom)) + 100px);
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        opacity: 0.2;
        pointer-events: none;

    }
    .watermark img { max-height: 45px; max-width: 140px; object-fit: contain; }
    .watermark span { font-size: 13px; font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }

    /* Spinner Loading */
    .buffering-spinner {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 54px;
        height: 54px;
        border: 4px solid rgba(255,255,255,0.15);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        display: none;
        z-index: 5;
    }
    .is-buffering .buffering-spinner { display: block; }

    @keyframes spin { 100% { transform: translate(-50%, -50%) rotate(360deg); } }

    .hidden-icon { display: none !important; }


    #channel-player::cue {
        font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;

    @media (max-width: 768px) {

        .watermark {
            right: max(20px, env(safe-area-inset-right));
            bottom: calc(max(20px, env(safe-area-inset-bottom)) + 80px);

    }

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const video = document.getElementById('channel-player');
        const playerContainer = document.getElementById('player-container');
        const youtubeIframeWrap = document.getElementById('youtube-iframe-wrap');
        const youtubeIframePlayer = document.getElementById('youtube-iframe-player');
        const controlsOverlay = document.getElementById('controls-overlay');
        const refreshBtn = document.getElementById('refresh-btn');
        const centerPlayBtn = document.getElementById('center-play-btn');
        
        // Botões da UI
        const playPauseBtn = document.getElementById('play-pause-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const muteBtn = document.getElementById('mute-btn');
        const iconVolUp = document.getElementById('icon-vol-up');
        const iconVolMute = document.getElementById('icon-vol-mute');
        const volumeSlider = document.getElementById('volume-slider');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const iconFsEnter = document.getElementById('icon-fs-enter');
        const iconFsExit = document.getElementById('icon-fs-exit');
        const liveBtn = document.getElementById('live-btn');
        const castButton = document.getElementById('cast-button');
        const pipBtn = document.getElementById('pip-btn');
        const sourceSelect = document.getElementById('source-select');
        const sourceSelectWrap = document.getElementById('source-select-wrap');
        const channelHeading = document.getElementById('channel-heading');
        const channelHeadingTitle = document.getElementById('channel-heading-title');
        const channelHeadingLogo = document.getElementById('channel-heading-logo');
        const streamQualitySelect = document.getElementById('stream-quality-select');
        const streamQualitySelectWrap = document.getElementById('stream-quality-select-wrap');
        const streamQualityMenu = document.getElementById('stream-quality-menu');
        const streamQualityMenuItems = document.getElementById('stream-quality-menu-items');
        const subtitleSelect = document.getElementById('subtitle-select');
        const subtitleSelectWrap = document.getElementById('subtitle-select-wrap');
        const subtitleMenu = document.getElementById('subtitle-menu');
        const subtitleMenuItems = document.getElementById('subtitle-menu-items');
        const audioSelect = document.getElementById('audio-select');
        const audioSelectWrap = document.getElementById('audio-select-wrap');
        const audioMenu = document.getElementById('audio-menu');
        const audioMenuItems = document.getElementById('audio-menu-items');
        
        let hideControlsTimeout;
        let stallMonitorTimer = null;
        let lastPlaybackTime = 0;
        let stallTicks = 0;
        let lastRecoveryAt = 0;
        let runtimePlayerUrl = (typeof window.__PLAY_RUNTIME_URL === 'string' && window.__PLAY_RUNTIME_URL) ? window.__PLAY_RUNTIME_URL : window.location.href;
        let adaptiveMenuRefreshQueued = false;

        // ==========================================
        // LÓGICA DO BOTÃO REFRESH (Iframe Referrer)
        // ==========================================
        if (refreshBtn) {
            refreshBtn.addEventListener('click', function (event) {
                event.preventDefault();
                event.stopPropagation();

                var refreshHref = refreshBtn.getAttribute('data-reload-url') || refreshBtn.getAttribute('href') || window.location.pathname.replace(/^\/__play\//, '/');
                try {
                    var target = new URL(refreshHref, window.location.origin);
                    if (typeof currentIndex === 'number' && !Number.isNaN(currentIndex)) {
                        target.searchParams.set('si', String(currentIndex));
                    }
                    target.searchParams.set('r', 'reload');
                    target.searchParams.set('_ts', String(Date.now()));
                    var finalUrl = target.toString();
                    if (window.parent && window.parent !== window) {
                        window.parent.location.replace(finalUrl);
                        return;
                    }
                    window.location.replace(finalUrl);
                } catch (e) {
                    window.location.replace(refreshHref);
                }
            });
        }

        // ==========================================
        // UI GERAL
        // ==========================================
        function showControls() {
            controlsOverlay.classList.remove('hidden');
            playerContainer.style.cursor = 'default';
            clearTimeout(hideControlsTimeout);
            
            if (!video.paused) {
                hideControlsTimeout = setTimeout(() => {
                    controlsOverlay.classList.add('hidden');
                    playerContainer.style.cursor = 'none';
                }, 3500);
            }
        }

        playerContainer.addEventListener('mousemove', showControls);
        playerContainer.addEventListener('touchstart', showControls);
        playerContainer.addEventListener('mouseleave', () => { if (!video.paused) controlsOverlay.classList.add('hidden'); });

        // Play/Pause
        function safePlay(userGesture) {
            var playPromise = null;
            try { playPromise = video.play(); } catch (e) { return Promise.resolve(false); }
            if (playPromise && typeof playPromise.then === 'function') {
                return playPromise.then(function () { return true; }).catch(function () { return false; });
            }
            return Promise.resolve(true);
        }

        function togglePlay() {
            if (video.paused) {
                safePlay(true);
            } else {
                video.pause();
            }
        }
        playPauseBtn.addEventListener('click', togglePlay);
        video.addEventListener('click', togglePlay);
        if (centerPlayBtn) centerPlayBtn.addEventListener('click', function (event) {
            event.preventDefault();
            event.stopPropagation();
            safePlay(true);
        });

        function updateCenterPlayButton() {
            if (!centerPlayBtn) return;
            centerPlayBtn.classList.toggle('is-hidden', !video.paused);
        }

        video.addEventListener('play', () => {
            iconPlay.classList.add('hidden-icon');
            iconPause.classList.remove('hidden-icon');
            updateCenterPlayButton();
            showControls();
        });
        
        video.addEventListener('pause', () => {
            iconPause.classList.add('hidden-icon');
            iconPlay.classList.remove('hidden-icon');
            updateCenterPlayButton();
            showControls();
        });

        // Volume
        function updateVolumeUI() {
            if (video.muted || video.volume === 0) {
                iconVolUp.classList.add('hidden-icon');
                iconVolMute.classList.remove('hidden-icon');
                volumeSlider.value = 0;
            } else {
                iconVolMute.classList.add('hidden-icon');
                iconVolUp.classList.remove('hidden-icon');
                volumeSlider.value = video.volume;
            }
        }

        muteBtn.addEventListener('click', () => {
            video.muted = !video.muted;
            if(!video.muted && video.volume === 0) video.volume = 0.5;
            updateVolumeUI();
        });

        volumeSlider.addEventListener('input', (e) => {
            video.volume = e.target.value;
            video.muted = (video.volume === 0);
            updateVolumeUI();
        });

        // Botão Live
        if (liveBtn) {
            liveBtn.addEventListener('click', () => {
                video.currentTime = video.seekable.length ? video.seekable.end(video.seekable.length - 1) : video.currentTime + 9999;
                if(video.paused) safePlay(true);
            });
        }

        // ==========================================
        // PICTURE-IN-PICTURE (PiP)
        // ==========================================
        function canUsePictureInPicture() {
            return !!(
                (document.pictureInPictureEnabled && !video.disablePictureInPicture && typeof video.requestPictureInPicture === 'function') ||
                typeof video.webkitSetPresentationMode === 'function'
            );
        }

        if (canUsePictureInPicture()) {
            pipBtn.addEventListener('click', async () => {
                try {
                    if (document.pictureInPictureElement) {
                        await document.exitPictureInPicture();
                        return;
                    }

                    if (typeof video.requestPictureInPicture === 'function' && document.pictureInPictureEnabled && !video.disablePictureInPicture) {
                        await video.requestPictureInPicture();
                        return;
                    }

                    if (typeof video.webkitSetPresentationMode === 'function') {
                        video.webkitSetPresentationMode(video.webkitPresentationMode === 'picture-in-picture' ? 'inline' : 'picture-in-picture');
                    }
                } catch (err) { console.error('Erro no PiP:', err); }
            });
        } else {
            pipBtn.style.display = 'none';
        }

        // ==========================================
        // TELA CHEIA
        // ==========================================
        async function toggleFullscreen() {
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    if (playerContainer.requestFullscreen) {
                        await playerContainer.requestFullscreen();
                    } else if (video.requestFullscreen) {
                        await video.requestFullscreen();
                    } else if (playerContainer.webkitRequestFullscreen) {
                        playerContainer.webkitRequestFullscreen();
                    } else if (video.webkitRequestFullscreen) {
                        video.webkitRequestFullscreen();
                    } else if (video.webkitEnterFullscreen) {
                        video.webkitEnterFullscreen();
                    }
                } else if (document.exitFullscreen) {
                    await document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            } catch (err) {
                console.error('Erro no fullscreen:', err);
            }
        }
        
        fullscreenBtn.addEventListener('click', toggleFullscreen);
        video.addEventListener('dblclick', toggleFullscreen);

        function updateFullscreenUI() {
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                iconFsEnter.classList.add('hidden-icon');
                iconFsExit.classList.remove('hidden-icon');
            } else {
                iconFsExit.classList.add('hidden-icon');
                iconFsEnter.classList.remove('hidden-icon');
            }
        }
        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

        // Spinner
        function stopBufferingUi() {
            playerContainer.classList.remove('is-buffering');
            markSourceHealthy();
            sourceSwitchInProgress = false;
        }

        function startBufferingUi() {
            if (video.readyState >= 3 || video.readyState === 4) {
                stopBufferingUi();
                return;
            }
            playerContainer.classList.add('is-buffering');
        }

        video.addEventListener('waiting', startBufferingUi);
        video.addEventListener('stalled', startBufferingUi);
        video.addEventListener('seeking', startBufferingUi);
        video.addEventListener('playing', function () { stopBufferingUi(); });
        video.addEventListener('canplay', stopBufferingUi);
        video.addEventListener('canplaythrough', stopBufferingUi);
        video.addEventListener('loadeddata', function () {
            updateCenterPlayButton();
            stopBufferingUi();
            scheduleAdaptiveMenusRefresh();
        });
        video.addEventListener('loadedmetadata', function () {
            updateCenterPlayButton();
            stopBufferingUi();
            scheduleAdaptiveMenusRefresh();
        });
        video.addEventListener('error', function () {
            startBufferingUi();
            attemptPlaybackRecovery('video-error');
        });
        video.addEventListener('timeupdate', function () {
            if (video.readyState >= 3 && video.currentTime >= 0) {
                stopBufferingUi();
            }
        });

        // ==========================================
        // LÓGICA DE STREAMING & CAST
        // ==========================================
