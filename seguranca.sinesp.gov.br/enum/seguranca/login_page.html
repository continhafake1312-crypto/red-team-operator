        <script type="text/javascript">
	        $(document).ready(function() {
            	if ($("#formLogin\\:codigoOtp2").length > 0) {
            		$("#formLogin\\:codigoOtp2").focus();
            	} else if ($("#formLogin\\:codigoOtp1").length > 0) {
               		$("#formLogin\\:codigoOtp1").focus();
            	} else if ($("#formLogin\\:senha").length > 0) {
               		$("#formLogin\\:senha").focus();
            	} else if ($("#formLogin\\:identificacao").length > 0) {
               		$("#formLogin\\:identificacao").focus();
                }
                $(".inputCpf, .input-rec-cpf").inputmask("(999.999.999-99)|(aa999999999)",
                    {clearMaskOnLostFocus: true, 
                        showMaskOnHover: false,
                        oncomplete: function() {
                            if($(this).hasClass('inputCpf')) {
                                $('.inputSenha').focus();
                            } else {
                                $('.input-txt-captcha-rec-senha').focus();
                            }
                        }
                    } 
                );
                
                if( /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) ) {
                	$(".inputCpf, .input-rec-cpf").inputmask("(99999999999)|(aa999999999)",
                           {clearMaskOnLostFocus: false, 
                               showMaskOnHover: false,
                               oncomplete: function() {
                                   if($(this).hasClass('inputCpf')) {
                                       $('.inputSenha').focus();
                                   } else {
                                       $('.input-txt-captcha-rec-senha').focus();
                                   }
                               }
                           } 
                       );
               	}
                
                $('.inputCpf, .input-rec-cpf').keypress(function() {
                    $(".input-rec-cpf, .inputCpf").val($(this).val());
                });
        
                $('#formLogin\\:btnEntrar').on('click', function () {
                    var captchaValue = ($('#formLogin\\:j_captcha_response_text').length) ? $('#formLogin\\:j_captcha_response_text').val() : '';
                    console.debug("[Sinesp Captcha] submit login", {
                        captchaAntigoRenderizado: $('#formLogin\\:j_captcha_response_text').length > 0,
                        captchaAntigoInformado: !!captchaValue
                    });
                    $('#formLogin\\:j_captcha_response').val(captchaValue);
                });

                $('#formLogin\\:btnRecSalvar').on('click', function () {
                    var captchaRecuperacao = ($('#formLogin\\:j_captcha_response_rec_senha').length) ? $('#formLogin\\:j_captcha_response_rec_senha').val() : '';
                    console.debug("[Sinesp Captcha] submit recuperacao senha", {
                        captchaAntigoRenderizado: $('#formLogin\\:j_captcha_response_rec_senha').length > 0,
                        captchaAntigoInformado: !!captchaRecuperacao
                    });
                });
        
                $('#formLogin\\:j_captcha_response_text').val('');
                $('#formLogin\\:j_captcha_response_rec_senha').val('');
                
                $(window).capslockstate();
                $(window).bind("capsOn", function(event) {
                    $(".mensagemCapsLock").show();
                });
                $(window).bind("capsOff", function(event) {
                    $(".mensagemCapsLock").hide();
                });

                // fingerprint
                const clientJs = new ClientJS();
                var deviceData = {
               	    fingerprintKey: clientJs.getFingerprint(),
               	    engine: clientJs.getEngine(),
               	    engineVersion: clientJs.getEngineVersion(),
               	    device: clientJs.getDevice(),
               	    browser: clientJs.getBrowser(),
               	    browserVersion: clientJs.getBrowserVersion(),
               	    os: clientJs.getOS(),
               	    osVersion: clientJs.getOSVersion(),
               	    cpu: clientJs.getCPU(),
               	    userAgent: clientJs.getUserAgent(),
               	    screenResolution: clientJs.getScreenPrint(),
               	    plugins: clientJs.getPlugins(),
               	    timezone: clientJs.getTimeZone(),
               	    language: clientJs.getLanguage()
				};
                deviceData = JSON.stringify(deviceData);
                
                $('#formLogin\\:fingerprint').val(deviceData);
            });
		        
            function toggleDiv(a){var b=$("#"+a);if(b.css("display")=="none"){b.slideDown("slow")}else{b.slideUp("slow")}}

            var SinespHcaptcha = (function() {
                var fluxoPendente = null;
                var fluxoLiberado = null;
                var tokenFluxo = null;
                var botoes = {
                    login: "formLogin:btnEntrar",
                    recuperacao: "formLogin:btnRecSalvar"
                };

                function getById(id) {
                    return document.getElementById(id);
                }

                function limparToken() {
                    var token = getById("formLogin:hcaptchaToken");
                    if (token) {
                        token.value = "";
                    }
                    console.debug("[Sinesp hCaptcha] token local limpo");
                }

                function getToken() {
                    var token = getById("formLogin:hcaptchaToken");
                    return token ? token.value : "";
                }

                function setToken(token) {
                    var tokenInput = getById("formLogin:hcaptchaToken");
                    if (tokenInput) {
                        tokenInput.value = token;
                    } else {
                        console.error("[Sinesp hCaptcha] campo hidden hcaptchaToken nao encontrado");
                    }
                }

                function resetarHcaptcha() {
                    if (typeof hcaptcha !== "undefined" && hcaptcha.reset) {
                        console.debug("[Sinesp hCaptcha] resetando widget hCaptcha");
                        hcaptcha.reset();
                    }
                }

                return {
                    preparar: function(event, fluxo, deveExecutarInvisivel, deveValidarVisivel) {
                        console.debug("[Sinesp hCaptcha] preparar", {
                            fluxo: fluxo,
                            deveExecutarInvisivel: deveExecutarInvisivel,
                            deveValidarVisivel: deveValidarVisivel,
                            fluxoPendente: fluxoPendente,
                            fluxoLiberado: fluxoLiberado,
                            tokenFluxo: tokenFluxo
                        });

                        if (!deveExecutarInvisivel && !deveValidarVisivel) {
                            console.debug("[Sinesp hCaptcha] captcha nao exigido, submit liberado", {fluxo: fluxo});
                            return true;
                        }

                        if (deveValidarVisivel) {
                            if (tokenFluxo === fluxo && getToken()) {
                                console.debug("[Sinesp hCaptcha] hCaptcha visivel resolvido, submit liberado", {fluxo: fluxo});
                                tokenFluxo = null;
                                return true;
                            }

                            if (event) {
                                event.preventDefault();
                            }

                            if (tokenFluxo && tokenFluxo !== fluxo) {
                                limparToken();
                                tokenFluxo = null;
                            }

                            console.warn("[Sinesp hCaptcha] hCaptcha visivel pendente, submit bloqueado", {fluxo: fluxo});
                            return false;
                        }

                        if (fluxoLiberado === fluxo) {
                            console.debug("[Sinesp hCaptcha] fluxo ja validado pelo hCaptcha, submit liberado", {fluxo: fluxo});
                            fluxoLiberado = null;
                            return true;
                        }

                        if (typeof hcaptcha === "undefined" || !hcaptcha.execute) {
                            console.warn("[Sinesp hCaptcha] biblioteca hCaptcha indisponivel; submit seguira para validacao server-side", {fluxo: fluxo});
                            limparToken();
                            return true;
                        }

                        if (fluxoPendente) {
                            console.debug("[Sinesp hCaptcha] ja existe fluxo pendente, ignorando novo submit", {fluxoPendente: fluxoPendente});
                            return false;
                        }

                        if (event) {
                            event.preventDefault();
                        }

                        fluxoPendente = fluxo;
                        tokenFluxo = null;
                        limparToken();

                        try {
                            console.info("[Sinesp hCaptcha] executando desafio invisivel", {fluxo: fluxo});
                            hcaptcha.execute();
                        } catch (e) {
                            console.error("[Sinesp hCaptcha] erro ao executar hCaptcha", e);
                            fluxoPendente = null;
                            resetarHcaptcha();
                        }
                        return false;
                    },
                    confirmarInvisivel: function(token) {
                        var fluxo = fluxoPendente;
                        console.info("[Sinesp hCaptcha] callback de sucesso recebido", {
                            fluxo: fluxo,
                            modo: "invisivel",
                            tokenInformado: !!token
                        });

                        setToken(token);

                        if (!fluxo) {
                            console.warn("[Sinesp hCaptcha] callback recebido sem fluxo pendente");
                            return;
                        }

                        fluxoPendente = null;
                        fluxoLiberado = fluxo;
                        tokenFluxo = fluxo;

                        var botao = getById(botoes[fluxo]);
                        if (botao) {
                            console.debug("[Sinesp hCaptcha] reenviando clique original", {fluxo: fluxo});
                            botao.click();
                        } else {
                            console.error("[Sinesp hCaptcha] botao original nao encontrado", {fluxo: fluxo});
                        }
                    },
                    confirmarVisivel: function(token, fluxo) {
                        console.info("[Sinesp hCaptcha] callback visivel recebido", {
                            fluxo: fluxo,
                            modo: "visivel",
                            tokenInformado: !!token
                        });
                        setToken(token);
                        tokenFluxo = fluxo;
                    },
                    cancelar: function() {
                        console.warn("[Sinesp hCaptcha] fluxo cancelado/expirado/erro", {
                            fluxoPendente: fluxoPendente,
                            fluxoLiberado: fluxoLiberado,
                            tokenFluxo: tokenFluxo
                        });
                        fluxoPendente = null;
                        fluxoLiberado = null;
                        tokenFluxo = null;
                        limparToken();
                        resetarHcaptcha();
                    }
                };
            })();

            function onSinespHcaptchaInvisibleSubmit(token) {
                SinespHcaptcha.confirmarInvisivel(token);
            }

            function onSinespHcaptchaLoginVisibleSubmit(token) {
                SinespHcaptcha.confirmarVisivel(token, "login");
            }

            function onSinespHcaptchaRecuperacaoVisibleSubmit(token) {
                SinespHcaptcha.confirmarVisivel(token, "recuperacao");
            }

            function onSinespHcaptchaError() {
                SinespHcaptcha.cancelar();
            }

            function onSinespHcaptchaExpired() {
                SinespHcaptcha.cancelar();
            }

            function pressEnter(e){
            	var key = e.charCode ? e.charCode : e.keyCode ? e.keyCode : 0;
                if(key == 13) {

                	focoCampoSenha = $("#formLogin\\:rec-senha-cpf").is( ":focus" );
                	focoCampoCaptcha = $("#formLogin\\:j_captcha_response_rec_senha").css('border-top-color') == 'rgba(82, 168, 236, 0.8)';
                	focoBotao = $("#formLogin\\:btnRecSalvar").is( ":focus" );
                	if (focoCampoSenha || focoCampoCaptcha || focoBotao ){
                    	$('#formLogin\\:btnRecSalvar').click();
                    	e.preventDefault();
                    	return false;
                   	}

                	focoSenha = $("#formLogin\\:senha"     ).is( ":focus" );
                	focoOTP1  = $("#formLogin\\:codigoOtp1").is( ":focus" );
                	focoOTP2  = $("#formLogin\\:codigoOtp2").is( ":focus" );
                	focoCaptcha = $("#formLogin\\:j_captcha_response_text").is( ":focus" );
                	if (focoSenha || focoOTP1 || focoOTP2 || focoCaptcha){
                    	$('#formLogin\\:btnEntrar').click();
                    	e.preventDefault();
                    	return false;
                   	}
               	}
            }
            
            var idiff = 11;
            function reloadCaptcha() {
            	// precisa do idiff para evitar cache de GET
				idiff++;
                console.debug("[Sinesp Captcha] recarregando captcha antigo", {idiff: idiff});
                $(".imagemCaptcha, .imagemCaptchaRecuperarSenha").attr("src", "/sinesp-seguranca/scaptcha?" + idiff);

            }
            
            $(function()
			{
            	var browser = /chrome\/6[0-9]/.test(navigator.userAgent.toLowerCase());
            	
            	if(browser){
            		reloadCaptcha();
            		
            	}
            });
            
        </script>
