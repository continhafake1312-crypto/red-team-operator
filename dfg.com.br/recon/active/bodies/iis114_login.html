	<script type="text/javascript">
		var numberSelection = "";
		var currentSelection = 1;

		$(document).ready(function ()
		{
			FillLetters(currentSelection);
		});

		function FillLetters(number)
		{
			$('#spanSelecioneLetra').text('Selecione a ' + number + 'ª letra:');

			var letters = $('#array' + number).val();

			for (var i = 0; i < 5; i++)
			{
				var letras = "";

				for (var y = 0; y < 5; y++)
				{
					var pos = y;

					if (i != 0)
						pos = (i * 5) + y;

					letras = letras + " " + letters.substring(pos, pos + 1);
				}

				$('#texto' + i).text(letras);
			}
		}

		function SelectNumber(SelectedNumber)
		{
			numberSelection += SelectedNumber;

			currentSelection = currentSelection + 1;

			if (currentSelection != 5)
			{
				$('#divLetters').fadeOut();

				FillLetters(currentSelection);

				$('#divLetters').fadeIn(1000);
			}
			else
			{
				$('#divLetters').fadeOut();

				$('input[name=userSelection]').val(numberSelection);
				$('#btnOKLetters').hide();
				$('#btnOKLetters').click();
			}
		}

		function HideLetters()
		{
			$('#texto0').toggle();
			$('#texto1').toggle();
			$('#texto2').toggle();
			$('#texto3').toggle();
			$('#texto4').toggle();
		}

	</script>
