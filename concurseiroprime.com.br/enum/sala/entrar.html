            // Função para obter o valor de um cookie
            function getCookie(cname) {
                let name = cname + "=";
                let decodedCookie = decodeURIComponent(document.cookie);
                let ca = decodedCookie.split(';');
                for(let i = 0; i < ca.length; i++) {
                    let c = ca[i];
                    while (c.charAt(0) === ' ') {
                        c = c.substring(1);
                    }
                    if (c.indexOf(name) === 0) {
                        return c.substring(name.length, c.length);
                    }
                }
                return "";
            }

(function () {
    if (window.__igEscapeInit) return;
    window.__igEscapeInit = true;

    var ua = navigator.userAgent || navigator.vendor || window.opera || '';

    // WebView do Instagram/Facebook. FBAN/FBAV/FB_IAB = família Meta; "Instagram" = Insta.
    var isInApp = /Instagram|FBAN|FBAV|FB_IAB|FBIOS/i.test(ua);
    if (!isInApp) return;

    // Já dispensado nesta sessão? Não incomoda de novo.
    try { if (sessionStorage.getItem('__igEscapeDismissed') === '1') return; } catch (e) {}

    var isIOS = /iPhone|iPad|iPod/i.test(ua);
    var isAndroid = /Android/i.test(ua);

    // Android: intent:// abre o navegador padrão (Chrome) fora da WebView.
    function androidIntentUrl() {
        var url = window.location.href;
        var noScheme = url.replace(/^https?:\/\//i, '');
        return 'intent://' + noScheme +
            '#Intent;scheme=https;package=com.android.chrome;' +
            'S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
    }

    // iOS: googlechromes:// (https) / googlechrome:// (http) abre o Chrome, se instalado.
    function iosChromeUrl() {
        var url = window.location.href;
        if (/^https:\/\//i.test(url)) return url.replace(/^https:\/\//i, 'googlechromes://');
        if (/^http:\/\//i.test(url)) return url.replace(/^http:\/\//i, 'googlechrome://');
        return url;
    }

    function injectCss() {
        var css = [
            '#ig-escape-banner{position:fixed;top:0;left:0;right:0;z-index:2147483647;',
            'background:var(--ds-color-brand,var(--color-primary,#1f1f2b));',
            'color:var(--ds-color-brand-contrast,#fff);',
            'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;',
            'box-shadow:0 2px 12px rgba(0,0,0,.25);display:flex;align-items:center;gap:10px;',
            'padding:10px 12px;line-height:1.35;font-size:13px;-webkit-font-smoothing:antialiased;}',
            '#ig-escape-banner .igx-txt{flex:1 1 auto;min-width:0;}',
            '#ig-escape-banner .igx-txt strong{display:block;font-size:13px;font-weight:700;}',
            '#ig-escape-banner .igx-txt span{display:block;font-size:12px;opacity:.92;margin-top:2px;}',
            '#ig-escape-banner .igx-txt b{font-weight:800;}',
            '#ig-escape-banner .igx-hint{display:none;font-size:12px;opacity:.92;margin-top:4px;}',
            '#ig-escape-banner .igx-btn{flex:0 0 auto;background:#fff;color:#111;border:0;border-radius:8px;',
            'padding:9px 14px;font-size:13px;font-weight:700;text-decoration:none;cursor:pointer;white-space:nowrap;}',
            '#ig-escape-banner .igx-btn:active{opacity:.85;}',
            '#ig-escape-banner .igx-close{flex:0 0 auto;background:transparent;border:0;color:inherit;',
            'font-size:20px;line-height:1;opacity:.8;cursor:pointer;padding:2px 6px;}'
        ].join('');
        var style = document.createElement('style');
        style.textContent = css;
        document.head.appendChild(style);
    }

    function build() {
        if (document.getElementById('ig-escape-banner')) return;
        injectCss();

        var bar = document.createElement('div');
        bar.id = 'ig-escape-banner';
        bar.setAttribute('role', 'region');
        bar.setAttribute('aria-label', 'Abrir no navegador');

        var txt = document.createElement('div');
        txt.className = 'igx-txt';
        txt.innerHTML = '<strong>Abra no seu navegador</strong>' +
            '<span>A visualização do Instagram pode causar erros de login e pagamento.</span>';

        var btn = document.createElement('a');
        btn.className = 'igx-btn';
        btn.textContent = 'Abrir no navegador';
        btn.setAttribute('rel', 'noopener');

        if (isAndroid) {
            btn.setAttribute('href', androidIntentUrl());
        } else if (isIOS) {
            btn.setAttribute('href', iosChromeUrl());

            // Fallback: se o toque não trocar de app (Chrome ausente), revelar o ⋯.
            var hint = document.createElement('span');
            hint.className = 'igx-hint';
            hint.innerHTML = 'Não abriu? Toque em <b>•••</b> (canto superior direito) ' +
                'e escolha <b>“Abrir no navegador externo”</b>.';
            txt.appendChild(hint);

            btn.addEventListener('click', function () {
                var switched = false;
                var mark = function () { switched = true; };
                document.addEventListener('visibilitychange', function () {
                    if (document.hidden) switched = true;
                });
                window.addEventListener('pagehide', mark);
                // A navegação nativa do href tenta abrir o Chrome; aqui só armamos
                // o fallback caso o app não troque (Chrome não instalado).
                setTimeout(function () {
                    if (!switched) hint.style.display = 'block';
                }, 1400);
            });
        } else {
            // WebView desconhecida: melhor esforço abrindo a mesma URL fora.
            btn.setAttribute('href', window.location.href);
            btn.setAttribute('target', '_blank');
        }

        var close = document.createElement('button');
        close.className = 'igx-close';
        close.type = 'button';
        close.setAttribute('aria-label', 'Fechar');
        close.innerHTML = '&times;';
        close.addEventListener('click', function () {
            try { sessionStorage.setItem('__igEscapeDismissed', '1'); } catch (e) {}
            if (bar.parentNode) bar.parentNode.removeChild(bar);
        });

        bar.appendChild(txt);
        bar.appendChild(btn);
        bar.appendChild(close);
        document.body.appendChild(bar);
    }

    if (document.body) {
        build();
    } else {
        document.addEventListener('DOMContentLoaded', build);
    }
})();
</script>

<script>
    $(window).on('load', function () {
        $("#logout").on("click", function () {
            $.ajax({
                url: "/logout",
                method: "POST",
                success: function () {
                    window.location.reload();
                }
            });
        });

        
        
        $("#m_aside_left_minimize_toggle").click(function () {
            $("#m_aside_left_minimize_toggle i").hasClass("la-angle-double-left") ? $(
                "#m_aside_left_minimize_toggle i").removeClass("la-angle-double-left").addClass(
                "la-angle-double-right") : $("#m_aside_left_minimize_toggle i").removeClass(
                "la-angle-double-right").addClass("la-angle-double-left")
        });

            });

    
    function closeThemeTooltip() {
        var selectors = '#button-theme, #button-theme-mobile';

        if (window.jQuery && jQuery.fn.tooltip) {
            var $toggles = jQuery(selectors);
            try { $toggles.tooltip('hide'); } catch (e) {}

            $toggles.each(function () {
                var describedBy = this.getAttribute('aria-describedby');
                if (describedBy) {
                    jQuery('#' + describedBy).remove();
                    this.removeAttribute('aria-describedby');
                }
            });

            jQuery('.tooltip').filter(function () {
                var text = jQuery(this).text().trim();
                return text === 'Ativar tema claro' || text === 'Ativar tema escuro';
            }).remove();
        }

        if (document.activeElement && document.activeElement.matches && document.activeElement.matches(selectors)) {
            document.activeElement.blur();
        }
    }

    function changeTheme() {
        closeThemeTooltip();

        // Fonte da verdade = estado real do DOM (funciona para qualquer toggle: desktop ou mobile).
        var goingDark = !document.body.classList.contains("dark-mode");

        Cookies.set("theme", goingDark ? "dark" : "light", { expires: 365, path: '/' });

        if (goingDark) {
            document.body.classList.add("dark-mode");
            // injeta o stylesheet escuro se ainda não estiver na página
            var exists = document.getElementById("dark-theme")
                || document.querySelector('link[href*="themes/black"], link[href*="black.scss"], link[href*="/black-"]');
            if (!exists) {
                var link = document.createElement("link");
                link.type = "text/css";
                link.rel = "stylesheet";
                link.id = "dark-theme";
                link.href = "/build/vue/assets/black-DdoJgZbE.css";
                document.head.appendChild(link);
            }
        } else {
            document.body.classList.remove("dark-mode");
            // remove qualquer stylesheet do tema escuro
            document.querySelectorAll('#dark-theme, link[href*="themes/black"], link[href*="black.scss"], link[href*="/black-"]')
                .forEach(function (el) { el.remove(); });
        }

        // Sincroniza TODOS os toggles (desktop + mobile): checkbox, ícone e tooltip.
        document.querySelectorAll('.ed-theme-checkbox').forEach(function (cb) { cb.checked = goingDark; });
        document.querySelectorAll('.ed-theme-icon').forEach(function (ic) {
            ic.className = 'ed-theme-icon fa ' + (goingDark ? 'fa-sun' : 'fa-moon');
        });
        document.querySelectorAll('#button-theme, #button-theme-mobile').forEach(function (el) {
            el.setAttribute('data-original-title', goingDark ? 'Ativar tema claro' : 'Ativar tema escuro');
            el.setAttribute('title', goingDark ? 'Ativar tema claro' : 'Ativar tema escuro');
        });

        setTimeout(closeThemeTooltip, 0);

        // Sem reload — o tema é aplicado na hora.
    }

    // Dropdown de perfil no mobile (avatar) — abre/fecha + clique fora fecha.
    function toggleMobileProfileMenu(e) {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        var menu = document.getElementById('ead-mobile-profile-menu');
        if (menu) menu.classList.toggle('is-open');
    }
    document.addEventListener('click', function (e) {
        var wrap = document.getElementById('ead-mobile-avatar-wrap');
        var menu = document.getElementById('ead-mobile-profile-menu');
        if (menu && wrap && !wrap.contains(e.target)) {
            menu.classList.remove('is-open');
        }
    });

    
                    window.is_enrolled = false;
    
    
    
    $("#infoModal").on('show.bs.modal', function (event) {
        const userAgent = navigator.userAgent;
        const language = navigator.language;
        const platform = navigator.platform;
        const cookieEnabled = navigator.cookieEnabled;
        const screenWidth = screen.width;
        const screenHeight = screen.height;
        const pageWidth = document.documentElement.clientWidth;
        const pageHeight = document.documentElement.clientHeight;

        const info = `
        <strong>User Agent:</strong> ${userAgent}<br>
        <strong>Linguagem:</strong> ${language}<br>
        <strong>Plataforma:</strong> ${platform}<br>
        <strong>Cookies Ativados:</strong> ${cookieEnabled}<br>
        <strong>Resolução da Tela:</strong> ${screenWidth} x ${screenHeight}<br>
        <strong>Resolução da Página:</strong> ${pageWidth} x ${pageHeight}
    `;

        document.getElementById('info').innerHTML = info;
    });
